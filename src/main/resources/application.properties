# Import .env overrides for local or production use (not committed to git).
# Environment variables can also supply the uppercase settings below.
spring.config.import=optional:file:.env[.properties]

# ========== SERVER CONFIGURATION ==========
# Server ports to match Docker Compose configuration
server.port=8585
socket.port=8589
socket.host=0.0.0.0

# Trust X-Forwarded-* headers from reverse proxy (Nginx)
# Fixes Mixed Content errors: ensures request.isSecure()=true behind HTTPS proxy
server.forward-headers-strategy=framework

# Disable default error page
server.error.whitelabel.enabled=false

# ========== MULTIPART UPLOAD CONFIGURATION ==========
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# Optional: allow large uploads without swallowing
server.tomcat.max-swallow-size=50MB
server.tomcat.max-http-post-size=50MB


# ========== LOGGING ==========
# Set root logging level to warn to reduce console output
logging.level.root=warn

# ========== JWT SECURITY CONFIGURATION ==========
# JWT secret key for signing tokens (base64 encoded)
jwt.secret=bmlnaHRoYXdrY29kaW5nc29jaWV0eWFwY29tcHV0ZXJzY2llbmNlYQ==
# JWT Cookie settings - Production defaults (override in .env for local HTTP development)
jwt.cookie.secure=true
jwt.cookie.same-site=None
jwt.cookie.max-age=604800

# Toolchain Trail pairing: how long a pairing code and a paired agent last (ISO-8601 or 5m / 4h)
toolchain.pairing-code-lifetime=5m
toolchain.agent-token-lifetime=4h
# Where the first station tells students to clone pages (under their home folder); must match PROJECT_FOLDER in pages' toolchainTrailFixes.js
toolchain.project-folder=opencs/pages

# ========== SESSION CONFIGURATION ==========
# Session timeout (30 minutes)
spring.session.timeout=30m
# Custom session cookie name
server.servlet.session.cookie.name=sess_java_spring
# Session cookie must have SameSite=None; Secure for cross-origin requests
# Without this, browsers default SameSite=Lax and silently drop the cookie on cross-origin fetches
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# ========== DATABASE CONFIGURATION ==========
# Default to local SQLite. DB_URL switches the app to remote MySQL.
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.url=${DB_URL:jdbc:sqlite:volumes/sqlite.db?journal_mode=WAL}

# ========== DEFAULT PASSWORD ==========
# Password for seeded users and for admin/email resets. Must satisfy Person.PASSWORD_RULE.
# OCS-in-a-kit consumers set DEFAULT_PASSWORD in .env (or the environment) to override it.
person.default-password=${DEFAULT_PASSWORD:DefaultPassword123!}

# Dedicated Pages account for trusted assignment-owner synchronization.
# Provisioning is disabled unless PAGES_BOT_PASSWORD is explicitly configured.
assignment.sync.uid=${PAGES_BOT_UID:pages-bot}
assignment.sync.password=${PAGES_BOT_PASSWORD:}
assignment.sync.email=${PAGES_BOT_EMAIL:pages-bot@example.com}

# ========== JPA/HIBERNATE CONFIGURATION ==========
# Dialect is injected automatically from DB_URL.
# Disable SQL logging in production
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Disable Open Session In View pattern (avoid lazy loading issues)
spring.jpa.open-in-view=false
# Don't auto-update database schema (manage migrations manually)
spring.jpa.hibernate.ddl-auto=none
# Quote identifiers in generated SQL (required for reserved table names like groups in MySQL)
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# ========== DATABASE CONNECTION POOL (HikariCP) ==========
# Connection timeout in milliseconds (60 seconds)
spring.datasource.hikari.connection-timeout=60000
# Maximum number of connections in the pool
spring.datasource.hikari.maximum-pool-size=5
# Minimum idle connections to maintain
spring.datasource.hikari.minimum-idle=5
# Connection validation timeout (3 seconds)
spring.datasource.hikari.validation-timeout=3000
# Maximum lifetime of a connection in the pool (30 minutes)
spring.datasource.hikari.max-lifetime=1800000

# ========== SPRING BOOT CONFIGURATION ==========
# Allow bean definition overriding
spring.main.allow-bean-definition-overriding=true
# Disable dev tools auto-config properties
spring.devtools.add-properties=false

# ========== EMAIL CONFIGURATION (Gmail SMTP) ==========
# Gmail SMTP server settings
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# Email credentials (consider moving to .env for security)
spring.mail.username=dnhsbathroom@gmail.com
spring.mail.password=vjor zncp naam daph
# Enable SMTP authentication and TLS
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Email delivery strategy
# Default provider for deployed environments; override with EMAIL_PROVIDER=smtp if needed
email.provider=${EMAIL_PROVIDER:formsubmit}
# Optional explicit reply-to for outbound messages
email.replyTo=${EMAIL_REPLY_TO:}
# FormSubmit endpoint template. Keep {recipient} token to inject issue owner email.
formsubmit.endpoint=${FORM_SUBMIT_ENDPOINT:https://formsubmit.co/ajax/{recipient}}
# Optional mapping for owner labels that are not user UIDs.
# Format: "toby:pranavs22638@gmail.com,alice:alice@example.com"
issue.owner.email-map=${ISSUE_OWNER_EMAIL_MAP:}

# ========== API KEYS ==========
# Google API Key (should be set in .env file for security)
google.api.key=AIzaSyC1xyYXgYfGRJrvMOY8iT2bZnb7-Nyd1HY

# ========== GEMINI AI CONFIGURATION ==========
# Gemini API settings (key should be overridden in .env file)
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent}

# ========== GROQ AI CONFIGURATION ==========
# Shared fallback credential; personal keys are stored separately through Profile.
groq.api.key=${GROQ_API_KEY:}
groq.api.url=${GROQ_SERVER:https://api.groq.com/openai/v1/chat/completions}
# Default model for both personal and system Groq grading; override with an available model ID.
# An explicitly blank value disables Groq grading and personal Groq key connections.
groq.grading-model=${GROQ_GRADING_MODEL:llama-3.1-8b-instant}

# ========== PERSONAL AI KEY STORAGE ==========
# Permanent Base64-encoded 32-byte AES key, generated once with openssl rand -base64 32.
# Preserve across deployments and instances; never use a committed default secret.
# Missing/invalid keys disable personal storage, not uploads or system grading.
# Spring creates ai_connections at startup; the database account needs CREATE and CRUD access.
ai.key.encryption-key=${AI_KEY_ENCRYPTION_KEY:}

# ========== GITHUB API CONFIGURATION ==========
# GitHub API settings (token should be set in .env file)
github.api.base-url=${GITHUB_API_BASE_URL:https://api.github.com}
github.api.token=${GITHUB_API_TOKEN:}

# ========== SECURITY CONFIGURATION ==========
# Rate limiting: logged-in users are limited per user, anonymous requests per IP
security.rate-limit.requests-per-minute=1000
security.rate-limit.admin-requests-per-minute=5000
# Endpoints excluded from rate limiting
security.rate-limit.exempt-paths=/api/jokes
# /authenticate is limited per IP with its own bucket, so a class logging in at once is not blocked
security.rate-limit.login-requests-per-minute=300
# Wrong passwords allowed per account from one IP before /authenticate answers 429 for the window
security.rate-limit.login-failures-per-account=10
security.rate-limit.login-failure-window-minutes=15

# ========== AWS S3 CONFIGURATION ==========
# AWS S3 bucket name (set in .env file or environment)
aws.s3.bucket-name=${AWS_BUCKET_NAME:my-bucket}
# AWS access key ID (set in .env file or environment)
aws.s3.access-key-id=${AWS_ACCESS_KEY_ID:}
# AWS secret access key (set in .env file or environment)
aws.s3.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
# AWS region (set in .env file or environment)
aws.s3.region=${AWS_REGION:us-east-1}
# AWS endpoint (for local development)
aws.s3.endpoint=${AWS_S3_ENDPOINT:}

# ========== GITHUB GIST CONFIGURATION ==========
# GitHub Gist settings (token should be set in .env file)
gist.token=${GIST_TOKEN:}
gist.encryption-key=${GIST_TOKEN_ENCRYPTION_KEY:}

# ========== COURSE GROUPS CONFIGURATION ==========
# Canonical course groups: seeded by ModelInit on first startup and used to
# validate profile class selection. Order is significant (membership sync and
# API responses follow it). Overriding this line in .env replaces the whole list.
courses.class-groups=CSA,CSP,CSH,CSSE
# Bell period per course group. Every name listed above needs an entry.
# Individual periods can be overridden in .env, e.g. courses.periods[CSA]=4
courses.periods[CSA]=2
courses.periods[CSP]=3
courses.periods[CSH]=2
courses.periods[CSSE]=1
# Optional course code stored on the seeded group; defaults to the group name.
# courses.course-codes[CSA]=APCSA

# ========== UI BUILDER ==========
# Pages that may call the signed-in /api/ui-builder routes (UiBuilderRequestGuard). Exact origins:
# not the CORS patterns above, which also accept every *.opencodingsociety.com student server.
ui-builder.allowed-origins=https://pages.opencodingsociety.com,https://open-coding-society.github.io,http://localhost:4000,http://localhost:4500,http://localhost:4599,http://localhost:4600,http://127.0.0.1:4000,http://127.0.0.1:4500,http://127.0.0.1:4599,http://127.0.0.1:4600
# Page document limits Spring checks (UiBuilderLimits). Keep them equal to limits in the Pages
# registry, _projects/systems/ui-builder/data/ui_builder.yml, so both sides accept the same pages.
ui-builder.limits.sections=25
ui-builder.limits.blocks-per-section=50
ui-builder.limits.live-blocks=8
ui-builder.limits.spec-chars=200000
ui-builder.limits.depth=12
ui-builder.limits.api-item-chars=500
ui-builder.limits.api-snapshot-items=50
ui-builder.limits.api-snapshot-chars=64000
ui-builder.limits.gallery-max=200
# Spring only: pages one person may own at once (deleted pages do not count).
ui-builder.limits.owner-pages-max=100
ui-builder.limits.slug-pattern=^[a-z0-9](?:[a-z0-9-]{1,62}[a-z0-9])$
ui-builder.limits.reserved-slugs=admin,login,logout,help,teacher,teachers,staff,official,ocs,new,edit,view,gallery,canvas,api,draft
