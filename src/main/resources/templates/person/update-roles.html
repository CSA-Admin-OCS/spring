<!DOCTYPE HTML>
<html xmlns:layout="http://www.w3.org/1999/xhtml" xmlns:th="http://www.w3.org/1999/xhtml"
    layout:decorate="~{layouts/style-only}" lang="en">

<th:block layout:fragment="body" th:remove="tag">
    <div class="container py-4">
        <!-- Roles Input Section -->
        <h3>Manage Roles</h3> <!-- Header for Roles section -->

        <p th:if="${person != null}">
            <strong th:text="${person.name} + ' (' + ${person.uid} + ')'">User</strong><br>
            Current roles:
            <span th:if="${person.roles.isEmpty()}">none</span>
            <span th:each="r : ${person.roles}" class="badge bg-secondary me-1" th:text="${r.name}">ROLE</span>
        </p>

        <div th:if="${param.error != null and param.error[0] == 'unknown_role'}"
             class="alert alert-warning" role="alert">
            That role does not exist in the database yet, so nothing was changed.
            A role has to be present in <code>person_role</code> before it can be assigned.
        </div>

        <form class="form-inline" action="#" th:object="${roleDto}" th:action="@{/mvc/person/update/role}" method="POST"
            onsubmit="(function(event){event.submitter.innerHTML='<span class=\'spinner-border spinner-border-sm\' role=\'status\' aria-hidden=\'true\'></span>';})(event)">

            <div style="display: none;">
                <input type="text" th:field="*{uid}" id="uid" placeholder="Uid Address" required>
            </div>

            <div class="mb-2">
                <!-- No radio defaults to checked: a click on Add/Remove Role with nothing
                     picked must fail visibly (browser blocks submit via `required`) rather
                     than silently applying whichever role used to be the hardcoded default. -->
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="roleName" id="role-user" value="ROLE_USER" required>
                    <label class="form-check-label" for="role-user">User</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" id="role-admin" name="roleName" value="ROLE_ADMIN">
                    <label class="form-check-label" for="role-admin">Admin</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" id="role-tester" name="roleName" value="ROLE_TESTER">
                    <label class="form-check-label" for="role-tester">Tester</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" id="role-teacher" name="roleName" value="ROLE_TEACHER">
                    <label class="form-check-label" for="role-teacher">Teacher</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" id="role-student" name="roleName" value="ROLE_STUDENT">
                    <label class="form-check-label" for="role-student">Student</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" id="role-mentor" name="roleName" value="ROLE_MENTOR">
                    <label class="form-check-label" for="role-mentor">Mentor</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" id="role-pending" name="roleName" value="ROLE_PENDING">
                    <label class="form-check-label" for="role-pending">Pending</label>
                </div>
            </div>
            <button class="btn btn-secondary btn-sm" type="submit">Add Role</button>
            <!-- Same radio set, different action: promoting an account (e.g. Pending -> Mentor)
                 needs a removal, and roles were add-only before this. -->
            <button class="btn btn-outline-danger btn-sm" type="submit"
                th:formaction="@{/mvc/person/remove/role}">Remove Role</button>
        </form>
    </div>
</th:block>

</html>
